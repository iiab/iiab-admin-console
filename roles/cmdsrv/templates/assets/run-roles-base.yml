---
- hosts: all
  become: yes

  vars_files:
  - vars/default_vars.yml
  - {{ cmdsrv_dir }}/assets/adm_ansible_vars.yml
  #- vars/{{ ansible_local.local_facts.os_ver }}.yml
  - /etc/iiab/local_vars.yml
  - /etc/iiab/iiab_state.yml

  roles:
    - { role: 0-init }

  post_tasks:
    - name: "Remove /usr/sbin/policy-rc.d (installed by 0-init) so later manual 'apt install' behaves normally"
      file:
        path: /usr/sbin/policy-rc.d
        state: absent
